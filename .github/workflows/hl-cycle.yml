name: hl-cycle

on:
  schedule:
    - cron: "*/10 * * * *"   # co 10 minut (publiczne repo = darmowe minuty)
  workflow_dispatch:          # pozwala odpalic recznie z zakladki Actions

permissions:
  contents: write             # wymagane do zapisu stanu spowrotem do repo

concurrency:
  group: hl-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cykl monitora + komendy
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python telegram_tools.py cycle

      - name: Zapis stanu do repo
        run: |
          git config user.name "hl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add telegram_monitor_state.json
          git diff --cached --quiet || git commit -m "state [skip ci]"
          git push
